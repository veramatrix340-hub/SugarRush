<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gem Rush</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff7fb;--fg:#2a1a3a;--card:#fff;--ac:#e0409a;--sel:#ffd54a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1230;--fg:#f5eaff;--card:#2b1d47;--ac:#ff6bc1}}
:root[data-theme="dark"]{--bg:#1c1230;--fg:#f5eaff;--card:#2b1d47;--ac:#ff6bc1}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;text-align:center}
.top{display:flex;justify-content:space-around;padding:12px;font-weight:700}
#b{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-width:400px;margin:0 auto;padding:8px;background:var(--card);border-radius:14px}
#b button{aspect-ratio:1;font-size:min(7vw,28px);border:0;border-radius:8px;background:var(--bg);padding:0;cursor:pointer}
#b button.s{background:var(--sel);transform:scale(1.1)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px}
.row button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}
#m{min-height:22px;font-size:14px}
</style></head><body>
<div class="top"><span>⭐ <b id="sc">0</b></span><span>👟 <b id="mv">25</b></span><span>🪙 <b id="co">0</b></span></div>
<div id="b"></div>
<div id="m"></div>
<div class="row">
<button onclick="ad('moves')">▶ Anuncio: +5 movimientos</button>
<button onclick="ad('x2')">▶ Anuncio: duplicar monedas de la partida</button>
<button onclick="ad('box')">▶ Anuncio: cofre sorpresa 🎁</button>
<button onclick="daily()">🎁 Premio diario</button>
<button onclick="inv()">👥 Invitar amigos (+50 🪙)</button>
<button onclick="reset()">↻ Nuevo juego</button>
</div>
<script>
const N=8,T=['🍓','🍋','🍇','🍏','🫐','🍊'],$=id=>document.getElementById(id);
let g=[],sel=null,score=0,moves=25,coins=0,gc=0,busy=false,adBusy=false;
try{coins=+localStorage.getItem('c')||0}catch(e){}
const wait=ms=>new Promise(r=>setTimeout(r,ms)),rnd=()=>Math.floor(Math.random()*T.length);
function msg(t){$('m').textContent=t}
function ui(){$('sc').textContent=score;$('mv').textContent=moves;$('co').textContent=coins;try{localStorage.setItem('c',coins)}catch(e){}}
function matches(){const s=new Set();
for(let r=0;r<N;r++)for(let c=0;c<N-2;c++){const i=r*N+c;if(g[i]!=null&&g[i]==g[i+1]&&g[i]==g[i+2]){s.add(i);s.add(i+1);s.add(i+2)}}
for(let c=0;c<N;c++)for(let r=0;r<N-2;r++){const i=r*N+c;if(g[i]!=null&&g[i]==g[i+N]&&g[i]==g[i+2*N]){s.add(i);s.add(i+N);s.add(i+2*N)}}
return s}
function draw(){$('b').innerHTML=g.map((v,i)=>`<button class="${i===sel?'s':''}" onclick="tap(${i})">${v==null?'':T[v]}</button>`).join('')}
function drop(){for(let c=0;c<N;c++){const col=[];for(let r=N-1;r>=0;r--)if(g[r*N+c]!=null)col.push(g[r*N+c]);while(col.length<N)col.push(rnd());for(let r=N-1,k=0;r>=0;r--,k++)g[r*N+c]=col[k]}}
function reset(){score=0;moves=25;gc=0;sel=null;g=Array.from({length:N*N},rnd);let m;while((m=matches()).size){m.forEach(i=>g[i]=rnd())}msg('');draw();ui()}
async function tap(i){if(busy||moves<=0)return;
if(sel==null){sel=i;draw();return}
const a=sel,d=Math.abs(a-i);sel=null;
if(!(d==1&&Math.floor(a/N)==Math.floor(i/N))&&d!=N){sel=i;draw();return}
busy=true;[g[a],g[i]]=[g[i],g[a]];draw();await wait(150);
if(!matches().size){[g[a],g[i]]=[g[i],g[a]];draw();busy=false;return}
moves--;let chain=0,m;
while((m=matches()).size){chain++;score+=m.size*10*chain;{const w=Math.ceil(m.size/3)*chain;coins+=w;gc+=w}m.forEach(x=>g[x]=null);draw();ui();await wait(220);drop();draw();await wait(220)}
if(chain>1)msg('¡Combo x'+chain+'! 🔥');
if(moves<=0)msg('Sin movimientos. Mira un anuncio para seguir o inicia otro juego.');
busy=false;ui()}
function ad(type){if(adBusy)return;adBusy=true;let t=3;msg('Anuncio… '+t+'s');
/* AQUÍ va tu red de anuncios (Adsgram / Monetag). Da la recompensa solo cuando el anuncio termine. */
const iv=setInterval(()=>{t--;if(t>0){msg('Anuncio… '+t+'s');return}clearInterval(iv);adBusy=false;
if(type=='moves'){moves+=5;msg('¡+5 movimientos!')}
else if(type=='x2'){coins+=gc;msg('¡Ganaste +'+gc+' 🪙 extra (x2)!');gc*=2}
else{const r=[20,30,50,100][Math.floor(Math.random()*4)];coins+=r;msg('🎁 ¡El cofre tenía '+r+' 🪙!')}
ui()},1000)}
function daily(){let k='d',t=new Date().toDateString(),ok=true;
try{ok=localStorage.getItem(k)!==t;if(ok)localStorage.setItem(k,t)}catch(e){}
if(ok){coins+=25;msg('¡Premio diario: +25 🪙!');ui()}else msg('Ya reclamaste hoy. ¡Vuelve mañana!')}
function inv(){msg('Abriendo invitación…');
window.open('https://t.me/share/url?url='+encodeURIComponent('https://t.me/TU_BOT?start=ref_TUID')+'&text='+encodeURIComponent('¡Juega Gem Rush y gana premios! 🍓'),'_blank')}
reset();
</script></body></html>
